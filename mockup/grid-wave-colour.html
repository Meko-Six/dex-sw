<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dex Grid Wave Colour</title>
  <style>
    /* A lab for the beat grid window's waveform: today's grey drawing beside a
       deck-colour one, both drawn from the main mockup's synthetic kick and hat
       (xdj-mixer-alt.html, gridSignal). The colour version splits the signal
       with the app's waveform crossovers (DexWaveform.c, 220 Hz and 3.5 kHz)
       and stacks three layers in shades of the deck colour: the whole signal
       outermost and darkest, MID inside it, HIGH brightest in the middle. */
    :root {
      --bg: #070708;
      --text: #f2f2f4;
      --muted: #a0a0a6;
      --a: #276fff;
      --b: #ff8a1f;
      --led: #ff8a00;
      --font-cond: "Avenir Next Condensed", "Helvetica Neue Condensed", Helvetica, Arial, sans-serif;
      --font-ui: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.3 var(--font-ui); }
    main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; }
    h1 { margin: 0 0 4px; font: 700 22px/1 var(--font-cond); letter-spacing: .16em; text-transform: uppercase; }
    .lede { margin: 0 0 14px; color: var(--muted); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 16px; }
    .keys { display: flex; align-items: center; gap: 4px; }
    .key {
      appearance: none; min-width: 44px; height: 36px; padding: 0 10px; border-radius: 2px; border: 1px solid #3a3a40;
      background: #141416; color: #e9e9ec; font: 700 15px/1 var(--font-cond); letter-spacing: .06em; cursor: pointer;
    }
    .key.on { background: #e9e9ec; color: #141416; border-color: #e9e9ec; }
    .key:disabled { opacity: .35; cursor: default; }
    .zoom { width: 66px; text-align: center; font: 700 15px/1 var(--font-cond); letter-spacing: .06em; }
    .label { font: 700 13px/1 var(--font-cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    input[type=range] { width: 160px; }
    .deck { margin-bottom: 22px; }
    .deck h2 { margin: 0 0 8px; font: 700 18px/1 var(--font-cond); letter-spacing: .16em; text-transform: uppercase; }
    .deck h2 span { color: var(--accent); }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 900px) { .pair { grid-template-columns: 1fr; } }
    figure { margin: 0; }
    figcaption { margin-bottom: 5px; }
    .gwave { position: relative; height: 270px; border-radius: 3px; border: 1px solid #3a3a40; background: #060607; overflow: hidden; }
    .gwave canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .glines { position: absolute; inset: 0; pointer-events: none; }
    .gbeat { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 176, 32, .85); }
    .gbeat.bar { width: 2px; background: #ffb020; }
    .gbeat b {
      position: absolute; top: 3px; left: 4px; font: 700 12px/1 ui-monospace, Menlo, monospace;
      color: var(--led); background: rgba(0, 0, 0, .62); padding: 2px 3px; border-radius: 3px;
    }
    /* The deck-colour version: white lines, so neither deck's colour hides them. */
    .gwave[data-style=colour] .gbeat { background: rgba(255, 255, 255, .7); }
    .gwave[data-style=colour] .gbeat.bar { background: #fff; }
    .gwave[data-style=colour] .gbeat b { color: #fff; }
    .gnow { position: absolute; top: 0; bottom: 0; width: 1px; background: #ff4a3d; }
    .gnow::before { content: ""; position: absolute; top: 0; left: -5px; border: 5px solid transparent; border-top-color: #ff4a3d; }
  </style>
</head>
<body>
<main>
  <h1>Grid wave colour</h1>
  <p class="lede">Today's grey grid waveform on the left, the deck-colour version on the right. Same signal, same lines.</p>

  <div class="bar">
    <span class="keys">
      <button class="key" id="out">−</button>
      <b class="zoom" id="zoom"></b>
      <button class="key" id="in">+</button>
    </span>
    <span class="label">Grid off by</span>
    <input type="range" id="shift" min="-40" max="40" step="1" value="0">
    <b class="zoom" id="shiftval"></b>
  </div>

  <section class="deck" style="--accent: var(--a)">
    <h2>Deck <span>A</span></h2>
    <div class="pair">
      <figure><figcaption class="label">Grey (today)</figcaption><div class="gwave" data-deck="A" data-style="grey"><canvas></canvas><div class="glines"></div></div></figure>
      <figure><figcaption class="label">Deck colour</figcaption><div class="gwave" data-deck="A" data-style="colour"><canvas></canvas><div class="glines"></div></div></figure>
    </div>
  </section>
  <section class="deck" style="--accent: var(--b)">
    <h2>Deck <span>B</span></h2>
    <div class="pair">
      <figure><figcaption class="label">Grey (today)</figcaption><div class="gwave" data-deck="B" data-style="grey"><canvas></canvas><div class="glines"></div></div></figure>
      <figure><figcaption class="label">Deck colour</figcaption><div class="gwave" data-deck="B" data-style="colour"><canvas></canvas><div class="glines"></div></div></figure>
    </div>
  </section>
</main>

<script>
  /* The main mockup's grid audio and window. */
  const AUDIO_GRID = {
    A: { bpm: 133.0, offsetMs: 489.9, colour: [0x27, 0x6f, 0xff] },
    B: { bpm: 130.0, offsetMs: 247.3, colour: [0xff, 0x8a, 0x1f] }
  };
  const ZOOMS = [8000, 4000, 2000, 1000, 500, 250];
  let zoom = 2, shiftMs = 0;
  const CENTRE_MS = 24000;

  const gridNoise = (ms) => { const x = Math.sin(Math.floor(ms * 8) * 12.9898) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; };
  function gridSignal(audio, ms) {
    const period = 60000 / audio.bpm;
    const beat = Math.floor((ms - audio.offsetMs) / period);
    const since = ms - (audio.offsetMs + beat * period);
    const downbeat = ((beat % 4) + 4) % 4 === 0;
    const pitch = 58 + 190 * Math.exp(-since / 14);
    const kick = (downbeat ? 1 : 0.84) * Math.exp(-since / 95) * Math.sin(2 * Math.PI * pitch * since / 1000);
    const off = since - period / 2;
    const hat = off >= 0 ? 0.3 * Math.exp(-off / 20) * gridNoise(ms) : 0;
    return kick + hat + 0.05 * gridNoise(ms);
  }

  /* DexWaveform.c's second-order sections. */
  function biquad(rate, hz, high) {
    const w = 2 * Math.PI * Math.min(hz, rate * 0.45) / rate;
    const c = Math.cos(w), alpha = Math.sin(w) / Math.SQRT2, a0 = 1 + alpha;
    const b0 = (high ? 1 + c : 1 - c) / 2 / a0;
    const f = { b0, b1: (high ? -(1 + c) : 1 - c) / a0, b2: b0, a1: -2 * c / a0, a2: (1 - alpha) / a0, z1: 0, z2: 0 };
    return (x) => { const y = f.b0 * x + f.z1; f.z1 = f.b1 * x - f.a1 * y + f.z2; f.z2 = f.b2 * x - f.a2 * y; return y; };
  }

  const RATE = 44100;
  /* Per column: the signal's lowest and highest, and MID and HIGH envelopes
     (instant rise, 4 ms fall), so the layers keep the hit's exact start. */
  function readColumns(audio, startMs, spanMs, count) {
    const hp220 = biquad(RATE, 220, 1), lp3500 = biquad(RATE, 3500, 0), hp3500 = biquad(RATE, 3500, 1);
    const fall = Math.exp(-1 / (RATE * 0.004));
    const lo = new Float32Array(count), hi = new Float32Array(count), mid = new Float32Array(count), top = new Float32Array(count);
    const warm = 60, first = Math.floor((startMs - warm) * RATE / 1000), last = Math.ceil((startMs + spanMs) * RATE / 1000);
    let midEnv = 0, highEnv = 0;
    for (let n = first; n < last; n++) {
      const ms = n * 1000 / RATE, x = ms < 0 ? 0 : gridSignal(audio, ms);
      const m = Math.abs(lp3500(hp220(x))), h = Math.abs(hp3500(x));
      midEnv = Math.max(m, midEnv * fall); highEnv = Math.max(h, highEnv * fall);
      const column = Math.floor((ms - startMs) / spanMs * count);
      if (column < 0 || column >= count) continue;
      lo[column] = Math.min(lo[column], x); hi[column] = Math.max(hi[column], x);
      mid[column] = Math.max(mid[column], midEnv); top[column] = Math.max(top[column], highEnv);
    }
    return { lo, hi, mid, top };
  }

  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;

  function paint(box) {
    const key = box.dataset.deck, audio = AUDIO_GRID[key], style = box.dataset.style;
    const canvas = box.querySelector('canvas');
    const columns = box.clientWidth * 2, height = box.clientHeight * 2;
    canvas.width = columns; canvas.height = height;
    const context = canvas.getContext('2d');
    const spanMs = ZOOMS[zoom], startMs = CENTRE_MS - spanMs / 2;
    const { lo, hi, mid, top } = readColumns(audio, startMs, spanMs, columns);
    const middle = height / 2, reach = middle - 12;
    if (style === 'grey') {
      context.fillStyle = '#dfe2e4';
      for (let c = 0; c < columns; c++) context.fillRect(c, middle - hi[c] * reach, 1, Math.max(1, (hi[c] - lo[c]) * reach));
    } else {
      const deck = audio.colour, black = [6, 6, 7], white = [255, 255, 255];
      // Outermost: the whole signal, its real lowest and highest, in the dark shade.
      context.fillStyle = rgb(mix(black, deck, 0.55));
      context.beginPath();
      context.moveTo(0, middle - hi[0] * reach);
      for (let c = 1; c < columns; c++) context.lineTo(c, middle - hi[c] * reach);
      for (let c = columns - 1; c >= 0; c--) context.lineTo(c, middle - lo[c] * reach);
      context.closePath(); context.fill();
      // MID, then HIGH, mirrored about the middle, lighter towards the centre.
      const layer = (values, gain, colour) => {
        context.fillStyle = rgb(colour);
        context.beginPath();
        context.moveTo(0, middle);
        for (let c = 0; c < columns; c++) context.lineTo(c, middle - Math.min(1, values[c] * gain) * reach);
        for (let c = columns - 1; c >= 0; c--) context.lineTo(c, middle + Math.min(1, values[c] * gain) * reach);
        context.closePath(); context.fill();
      };
      layer(mid, 1.2, deck);
      layer(top, 0.9, mix(deck, white, 0.72));
    }
    box.querySelector('.glines').innerHTML = lines(audio, startMs, spanMs);
  }

  /* The deck's true grid, moved by the slider, as gridLines draws it. */
  function lines(audio, startMs, spanMs) {
    const period = 60000 / audio.bpm, offset = audio.offsetMs + shiftMs;
    const first = Math.floor((startMs - offset) / period) - 1, last = Math.ceil((startMs + spanMs - offset) / period) + 1;
    let out = '';
    for (let beat = first; beat <= last; beat++) {
      const pct = ((offset + beat * period - startMs) / spanMs) * 100;
      if (pct < -0.5 || pct > 100.5) continue;
      const downbeat = ((beat % 4) + 4) % 4 === 0;
      out += '<span class="gbeat' + (downbeat ? ' bar' : '') + '" style="left:' + pct.toFixed(2) + '%">' +
        (downbeat ? '<b>' + (Math.floor(beat / 4) + 1) + '</b>' : '') + '</span>';
    }
    out += '<span class="gnow" style="left:50%"></span>';
    return out;
  }

  function render() {
    const span = ZOOMS[zoom];
    document.getElementById('zoom').textContent = span >= 1000 ? span / 1000 + ' S' : span + ' MS';
    document.getElementById('out').disabled = zoom === 0;
    document.getElementById('in').disabled = zoom === ZOOMS.length - 1;
    document.getElementById('shiftval').textContent = (shiftMs > 0 ? '+' : '') + shiftMs + ' MS';
    document.querySelectorAll('.gwave').forEach(paint);
  }
  document.getElementById('out').onclick = () => { zoom = Math.max(0, zoom - 1); render(); };
  document.getElementById('in').onclick = () => { zoom = Math.min(ZOOMS.length - 1, zoom + 1); render(); };
  document.getElementById('shift').oninput = (event) => { shiftMs = Number(event.target.value); render(); };
  let resize; addEventListener('resize', () => { clearTimeout(resize); resize = setTimeout(render, 80); });
  render();
</script>
</body>
</html>
