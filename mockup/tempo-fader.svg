<svg xmlns="http://www.w3.org/2000/svg" width="176" height="919" viewBox="0 0 176 919" role="img" aria-labelledby="faderTitle faderDesc">
  <title id="faderTitle">Tempo fader</title>
  <desc id="faderDesc">A vertical tempo fader: a recessed rounded channel, a ribbed dark-grey cap with a white index line, and a dotted minus, zero and plus scale on the left.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060607"/>
      <stop offset=".5" stop-color="#0c0c0d"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx=".5" cy=".47" r=".62">
      <stop offset="0" stop-color="#19191b" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#121213" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0a0a0b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303035"/>
      <stop offset=".45" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#26262a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232325"/>
      <stop offset=".12" stop-color="#1d1d1f"/>
      <stop offset=".5" stop-color="#18181a"/>
      <stop offset=".88" stop-color="#1b1b1d"/>
      <stop offset="1" stop-color="#212123"/>
    </linearGradient>
    <linearGradient id="panelRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55555c" stop-opacity=".9"/>
      <stop offset=".07" stop-color="#2c2c31" stop-opacity=".4"/>
      <stop offset=".5" stop-color="#040405" stop-opacity=".65"/>
      <stop offset=".93" stop-color="#2a2a2f" stop-opacity=".3"/>
      <stop offset="1" stop-color="#4c4c53" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scaleDots" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="792">
      <stop offset="0" stop-color="#9d9da1" stop-opacity="0"/>
      <stop offset=".06" stop-color="#b4b4b8" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#c2c2c6" stop-opacity=".95"/>
      <stop offset=".94" stop-color="#adadb1" stop-opacity=".8"/>
      <stop offset="1" stop-color="#9d9da1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="slotHalo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#050506" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0a0a0b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="capBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset=".45" stop-color="#1d1d20"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="capBack" gradientUnits="userSpaceOnUse" x1="0" y1="379" x2="0" y2="405">
      <stop offset="0" stop-color="#2e2e33"/>
      <stop offset=".3" stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="shoulderBack" gradientUnits="userSpaceOnUse" x1="0" y1="405" x2="0" y2="431">
      <stop offset="0" stop-color="#5c5c64"/>
      <stop offset=".1" stop-color="#53535b"/>
      <stop offset=".8" stop-color="#4a4a51"/>
      <stop offset=".95" stop-color="#303036"/>
      <stop offset="1" stop-color="#1a1a1d"/>
    </linearGradient>
    <linearGradient id="railTop" gradientUnits="userSpaceOnUse" x1="0" y1="431" x2="0" y2="461">
      <stop offset="0" stop-color="#3c3c43"/>
      <stop offset=".18" stop-color="#56555e"/>
      <stop offset=".5" stop-color="#5b5b63"/>
      <stop offset=".8" stop-color="#4d4d55"/>
      <stop offset="1" stop-color="#303036"/>
    </linearGradient>
    <linearGradient id="shoulderFront" gradientUnits="userSpaceOnUse" x1="0" y1="461" x2="0" y2="497">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset=".1" stop-color="#3a3a40"/>
      <stop offset=".38" stop-color="#46464d"/>
      <stop offset=".8" stop-color="#4d4d54"/>
      <stop offset=".9" stop-color="#4a4a51"/>
      <stop offset=".95" stop-color="#2a2a2f"/>
      <stop offset="1" stop-color="#161619"/>
    </linearGradient>
    <linearGradient id="capSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b4b50" stop-opacity=".32"/>
      <stop offset=".06" stop-color="#4b4b50" stop-opacity="0"/>
      <stop offset=".94" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".32"/>
    </linearGradient>

    <filter id="bezelShadow" x="-40%" y="-5%" width="180%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#000000" flood-opacity=".8"/>
    </filter>
    <filter id="soft6" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="soft1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="panelClip">
      <rect x="38" y="18" width="107" height="882" rx="21"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="176" height="919" fill="url(#bg)"/>
  <rect width="176" height="919" fill="url(#bgGlow)"/>

  <!-- recessed fader body -->
  <g filter="url(#bezelShadow)">
    <rect x="33" y="13" width="117" height="892" rx="25" fill="url(#bezel)" stroke="#46464c" stroke-width="1"/>
  </g>
  <rect x="35.5" y="15.5" width="112" height="887" rx="23" fill="#08080a"/>
  <rect x="38" y="18" width="107" height="882" rx="21" fill="url(#panel)" stroke="#3a3a40" stroke-width="1"/>

  <g clip-path="url(#panelClip)">
    <ellipse cx="91.5" cy="70" rx="58" ry="96" fill="url(#sheen)"/>
    <ellipse cx="91.5" cy="850" rx="58" ry="96" fill="url(#sheen)"/>
    <rect x="38" y="18" width="107" height="882" rx="21" fill="none" stroke="url(#panelRim)" stroke-width="3"/>
  </g>

  <!-- slider slot -->
  <rect x="82" y="55" width="19" height="810" rx="9" fill="url(#slotHalo)" opacity=".8"/>
  <rect x="87.5" y="59.5" width="8" height="801" rx="2.5" fill="#020203" stroke="#333339" stroke-width=".9"/>
  <rect x="88.3" y="61" width="1.2" height="798" fill="#50505a" opacity=".65"/>
  <rect x="94.2" y="61" width="1.2" height="798" fill="#18181b" opacity=".9"/>
  <rect x="89" y="59.6" width="5" height="1" rx=".5" fill="#3c3c43" opacity=".7"/>

  <!-- fader cap shadow -->
  <rect x="47" y="386" width="91" height="120" rx="6" fill="#000000" opacity=".7" filter="url(#soft6)"/>
  <rect x="85" y="391" width="14" height="100" rx="6" fill="#000000" opacity=".55" filter="url(#soft3)"/>

  <!-- fader cap: satin-black wedge with a raised centre rail -->
  <g>
    <!-- body -->
    <rect x="48" y="379" width="87" height="118" rx="5" fill="url(#capBody)" stroke="#050506" stroke-width="1"/>

    <!-- rear rounded edge -->
    <path d="M48 384a5 5 0 0 1 5-5h77a5 5 0 0 1 5 5v21H48z" fill="url(#capBack)"/>
    <path d="M52 379.6h79" stroke="#7c7c84" stroke-width="1" opacity=".55" filter="url(#soft1)"/>

    <!-- rear shoulder rising to the rail -->
    <rect x="48" y="405" width="87" height="26" fill="url(#shoulderBack)"/>
    <rect x="46" y="427.5" width="91" height="3.5" fill="#000000" opacity=".45" filter="url(#soft1)"/>
    <rect x="47.5" y="429.6" width="89" height="1.4" fill="#0b0b0c" opacity=".8"/>

    <!-- raised rail, overhanging the shoulders -->
    <rect x="46.5" y="431" width="90" height="30" rx="1.8" fill="url(#railTop)" stroke="#070709" stroke-width=".8" stroke-opacity=".75"/>
    <rect x="48" y="431.7" width="87" height="1" rx=".5" fill="#7c7c84" opacity=".4"/>
    <rect x="46.5" y="432" width="2" height="28" fill="#000000" opacity=".3"/>
    <rect x="134.5" y="432" width="2" height="28" fill="#000000" opacity=".35"/>
    <rect x="47.5" y="459.4" width="88" height="1.2" fill="#040405"/>

    <!-- front shoulder falling to the finger edge -->
    <path d="M48 461h87v28a5 5 0 0 1-5 5H53a5 5 0 0 1-5-5z" fill="url(#shoulderFront)"/>
    <rect x="46" y="460" width="91" height="3" fill="#000000" opacity=".4" filter="url(#soft1)"/>
    <path d="M53 494.6h73" stroke="#4a4a51" stroke-width="1" opacity=".25"/>

    <!-- rolled sides -->
    <rect x="48" y="379" width="87" height="118" rx="5" fill="url(#capSide)"/>
    <rect x="48.6" y="408" width="1.4" height="80" fill="#ffffff" opacity=".05"/>
    <rect x="133.8" y="408" width="1.4" height="80" fill="#000000" opacity=".18"/>

    <!-- gloss on the near-left shoulder -->
    <ellipse cx="57" cy="478" rx="8" ry="14" fill="#ffffff" opacity=".03" filter="url(#soft3)"/>

    <!-- inlaid index stripe -->
    <rect x="55.4" y="445.4" width="73.2" height="1.2" fill="#000000" opacity=".28" filter="url(#soft1)"/>
    <rect x="55.4" y="444.2" width="73.2" height="2.4" fill="#f2f2f4"/>
    <rect x="55.4" y="444.2" width="73.2" height=".8" fill="#ffffff"/>
  </g>

  <!-- scale -->
  <line x1="30" y1="80" x2="30" y2="403" stroke="url(#scaleDots)" stroke-width="1.6" stroke-dasharray="1.6 5.2" stroke-linecap="butt"/>
  <line x1="30" y1="429" x2="30" y2="792" stroke="url(#scaleDots)" stroke-width="1.6" stroke-dasharray="1.6 5.2" stroke-linecap="butt"/>

  <rect x="24.5" y="64.9" width="11" height="2.2" rx="1.1" fill="#e2e2e5"/>
  <rect x="24.8" y="750.9" width="10.4" height="2.2" rx="1.1" fill="#e2e2e5"/>
  <rect x="28.9" y="746.8" width="2.2" height="10.4" rx="1.1" fill="#e2e2e5"/>

  <text x="30" y="421" fill="#e6e6ea" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">0</text>

  <!-- zero index mark, cropped by the left edge -->
  <rect x="0" y="413" width="25" height="6" fill="#ffffff" opacity=".35" filter="url(#soft3)"/>
  <rect x="-2" y="413.8" width="26.5" height="4.6" fill="#ffffff"/>

  <!-- film grain -->
  <rect width="176" height="919" filter="url(#grain)" opacity=".045"/>
</svg>
